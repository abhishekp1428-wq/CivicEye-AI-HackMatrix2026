<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Complaint | CivicEye AI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style/uploads.css">
</head>

<body>

    <!-- =========================
            HEADER
    ========================== -->

    <header class="topbar">

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>

        <span class="logo">
            CivicEye <em>AI</em>
        </span>

    </header>


    <!-- =========================
            MAIN
    ========================== -->

    <main class="container">

        <form id="complaintForm">

            <!-- Complaint Title -->

            <div class="field">

                <label for="title">
                    Complaint Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter Complaint Title"
                    required
                >

            </div>


            <!-- Location -->

            <div class="field">

                <label for="location">
                    Location
                </label>

                <div class="location-controls">
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter Complaint Location"
                        aria-describedby="locationStatus"
                        required
                    >
                    <button type="button" id="detectLocationBtn" class="location-button">Use GPS</button>
                    <button type="button" id="locationIconBtn" class="location-button location-icon-button" aria-label="Detect current location">⌖</button>
                </div>
                <small id="locationStatus" class="location-status" role="status" aria-live="polite"></small>

            </div>


            <!-- Upload Image -->

            <div id="captureBox" class="capture-box" role="button" tabindex="0" aria-label="Choose a photo of the issue">

                <img
                    id="preview"
                    alt="Preview"
                    style="display:none;"
                >

                <div id="placeholder">

                    <h3>📷 Upload Image</h3>

                    <p>
                        Click here to upload or capture an image.
                    </p>

                    <small>
                        JPG / PNG • Max 10MB
                    </small>

                </div>

                <button type="button" id="removeImageBtn" class="remove-image-btn" aria-label="Remove selected image" hidden>×</button>

            </div>


            <input
                type="file"
                id="fileInput"
                accept="image/*"
                capture="environment"
                hidden
            >


            <!-- Buttons -->

            <div class="buttons">

                <button
                    type="button"
                    id="retakeBtn"
                    style="display:none;"
                >
                    Retake
                </button>

                <button
                    type="button"
                    id="analyzeBtn"
                    style="display:none;"
                >
                    Analyze with AI
                </button>

            </div>


            <!-- AI Analysis -->

            <div
                id="analysisPanel"
                class="analysis"
                style="display:none;"
            >

                <h2>
                    AI Analysis
                </h2>

                <p id="analysisStatus" class="analysis-status" role="status" aria-live="polite">Ready to Analyze</p>

                <div id="analysisResults" hidden>
                    <div class="result-item">

                        <strong>Issue :</strong>

                        <span id="resType"></span>

                    </div>

                    <div class="result-item">

                        <strong>Severity :</strong>

                        <span id="resSeverity"></span>

                    </div>

                    <div class="result-item">

                        <strong>Department :</strong>

                        <span id="resDept"></span>

                    </div>

                    <div class="result-item">

                        <strong>Description :</strong>

                        <span id="resDescription"></span>

                    </div>

                    <div class="result-item">

                        <strong>Priority :</strong>

                        <span id="resPriority"></span>

                    </div>

                    <div class="result-item">

                        <strong>Estimated time :</strong>

                        <span id="estimatedTime">After review</span>

                    </div>
                </div>


                <!-- Note -->

                <div class="field">

                    <label for="note">

                        Additional Note

                    </label>

                    <textarea
                        id="note"
                        rows="5"
                        placeholder="Write additional information (Optional)"
                    ></textarea>

                </div>


                <button
                    type="button"
                    id="submitBtn"
                    class="submit-btn"
                >
                    Submit Complaint
                </button>

            </div>

        </form>

    </main>


    <!-- Toast -->

    <div
        id="toast"
        class="toast"
        style="display:none;"
    >

        Complaint Submitted Successfully ✅

    </div>


    <script src="../js/uploads.js"></script>

</body>
</html>
