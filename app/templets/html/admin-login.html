<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | CivicEye AI</title>
<style>
    body {
        font-family: 'Hind', sans-serif;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }
    .card {
        background: #1e293b;
        padding: 40px;
        border-radius: 12px;
        width: 340px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .card h1 {
        color: #f1f5f9;
        font-size: 20px;
        margin-bottom: 4px;
    }
    .card p {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 24px;
    }
    label {
        display: block;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
    }
    input {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 14px;
        margin-bottom: 16px;
        box-sizing: border-box;
    }
    button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    #errorMsg {
        color: #f87171;
        font-size: 13px;
        margin-top: 12px;
        min-height: 16px;
        display: block;
    }
</style>
</head>
<body>

<div class="card">
    <h1>Admin Login</h1>
    <p>CivicEye AI — Administrator Access</p>

    <form id="adminLoginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>

        <span id="errorMsg"></span>
    </form>
</div>

<script src="../js/admin-login.js"></script>
</body>
</html>
